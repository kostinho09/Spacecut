[package]
name = "spacecutter"
version = "2.0.0"
description = "Cut and download audio from Twitter/X Spaces"
license = "GPL-3.0-or-later"
authors = ["kostinho09"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
url = "2"
cpal = "0.16"
chrono = "0.4"
regex = "1"
dirs = "5"
tauri-plugin-notification = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
