# Builds Spacecut for Windows, as a zip with no installer: a Spacecut folder
# holding Spacecut.exe and, beside it, the bundled ffmpeg.exe (unchanged).
# Started by hand: Actions → Windows build → Run workflow, or
#   gh workflow run windows.yml
# The zip is under the run's Artifacts, kept for 7 days.
name: Windows build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      # Files exactly as in the repository (Git on Windows would otherwise
      # change the line endings of the text files)
      - run: git config --global core.autocrlf false

      # Each action fixed to the commit checked, not to a tag that its owner
      # (or someone who took over the account) could move to other code
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-11
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      # Tauri's own ready-made command, the version the Mac builds use; used
      # only if it is byte for byte the file checked (its SHA-256 is the one
      # GitHub recorded when Tauri's build uploaded it)
      - name: Tauri CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download tauri-cli-v2.12.4 -R tauri-apps/tauri -p cargo-tauri-x86_64-pc-windows-msvc.zip -D $env:RUNNER_TEMP
          $hash = (Get-FileHash "$env:RUNNER_TEMP\cargo-tauri-x86_64-pc-windows-msvc.zip" -Algorithm SHA256).Hash
          if ($hash -ne '3E8687FB184BD7F10EBD8642F7715F79F4A605C0694C142A21507E8A24DC0F8B') { "Stopped: the Tauri CLI download is not the file checked ($hash)"; exit 1 }
          Expand-Archive "$env:RUNNER_TEMP\cargo-tauri-x86_64-pc-windows-msvc.zip" "$env:RUNNER_TEMP\tauri-cli"
          $cli = Get-ChildItem "$env:RUNNER_TEMP\tauri-cli" -Recurse -Filter cargo-tauri.exe | Select-Object -First 1
          $bin = Join-Path ($env:CARGO_HOME ?? "$env:USERPROFILE\.cargo") bin
          Copy-Item $cli.FullName (Join-Path $bin cargo-tauri.exe) -Force
          cargo tauri --version

      - name: Build
        working-directory: src-tauri
        run: cargo tauri build --no-bundle

      - name: Zip
        id: zip
        run: |
          # The same name in every version: the README links to it in the latest release
          $name = "Spacecut-Windows.zip"
          $dir = "$env:RUNNER_TEMP\out\Spacecut"
          New-Item -ItemType Directory $dir -Force | Out-Null
          Copy-Item src-tauri/target/release/spacecutter.exe "$dir\Spacecut.exe"
          Copy-Item ffmpeg/windows/ffmpeg.exe "$dir\ffmpeg.exe"
          Get-FileHash "$dir\ffmpeg.exe" | ForEach-Object { "ffmpeg.exe SHA-256 $($_.Hash)" }

          # Nothing of a person's computer in the app: no folder under a
          # Users or home folder other than this build machine's own
          $text = [System.Text.Encoding]::Latin1.GetString([System.IO.File]::ReadAllBytes("$dir\Spacecut.exe"))
          $paths = @([regex]::Matches($text, '(?i)\b[a-z]:[\\/]+users[\\/]+([^\\/\x00-\x1f"<>|:*?]+)')) +
                   @([regex]::Matches($text, '(?<![\w.])/(?:Users|home)/([^/\x00-\x1f"<>|:*?]+)/'))
          $personal = $paths | Where-Object { $_.Groups[1].Value -ne 'runneradmin' }
          if ($personal) {
            "Stopped: Spacecut.exe holds these paths:"
            $personal | ForEach-Object { $_.Value } | Sort-Object -Unique
            exit 1
          }

          New-Item -ItemType Directory dist -Force | Out-Null
          $zip = Join-Path $PWD "dist\$name"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory($dir, $zip, 'Optimal', $true)
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
          $entries = ($archive.Entries.FullName | Sort-Object) -join ', '
          $archive.Dispose()
          if ($entries -ne 'Spacecut/ffmpeg.exe, Spacecut/Spacecut.exe') {
            "Stopped: the zip holds $entries"
            exit 1
          }
          "Ready: $name ($([math]::Round((Get-Item $zip).Length / 1MB)) MB), checked: no personal paths"
          "name=$name" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/${{ steps.zip.outputs.name }}
          archive: false
          retention-days: 7
          if-no-files-found: error

      # The unit tests, on Windows (those that need the internet are left
      # out, as on the Mac)
      - name: Tests
        working-directory: src-tauri
        run: cargo test --locked
